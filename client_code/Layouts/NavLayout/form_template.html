<anvil-form layout="Mapping_Test.Layouts.BaseLayout">
  <anvil-block slot="actions"></anvil-block>
  <anvil-block slot="content">
    <style>
  .nlc-grid-3-9 {
    display: grid;
    grid-template-columns: calc(100% * 3 / 12) 1fr;
    gap: 16px;
    align-items: start;
    width: 100%;
    max-width: 100%;
    margin-left: 0;
    margin-right: 0;
    box-sizing: border-box;
  }
  @media (max-width: 760px) {
    .nlc-grid-3-9 {
      grid-template-columns: 1fr;
    }
  }
  .content .anvil-container:has(.nlc-grid-3-9),
  .anvil-inject-slot:has(.nlc-grid-3-9),
  main .anvil-container:has(.nlc-grid-3-9) {
    max-width: 100% !important;
    width: 100% !important;
    margin-left: 0 !important;
    padding-left: 16px !important;
    padding-right: 16px !important;
  }
</style>
    <div class="nlc-grid-3-9">
      <div>
        <anvil-component type="ColumnPanel" name="column_panel_1" prop:role="card">
          <anvil-component type="Link" name="about_link" prop:text="About the Naturist Map"></anvil-component>
          <anvil-component type="Link" name="view_scorecard_link" prop:text="View the Scorecard"></anvil-component>
          <anvil-component type="Link" name="view_map_link" prop:text="View the Map"></anvil-component>
          <anvil-component type="Link" name="best_friends" prop:text="Best Friends" container:grid_position="EKJPBX,LGSQVT"></anvil-component>
          <anvil-component type="Link" name="blogs" prop:text="   Blogs" container:grid_position="IPWXQB,YPWJKP"></anvil-component>
          <anvil-component type="Link" name="websites" prop:text="   Websites" container:grid_position="DIFVLR,RBFIDR"></anvil-component>
          <anvil-component type="Link" name="social" prop:text="   Social Media" container:grid_position="HCUSGU,QJBHNG"></anvil-component>
          <anvil-component type="Link" name="commercial" prop:text="   Commercial" container:grid_position="LIGDIB,YOYISM"></anvil-component>
          <anvil-component type="Link" name="associations" prop:text="   Associations" container:grid_position="IBEBBA,CLAEYG"></anvil-component>
          <anvil-component type="Link" name="discussion" prop:text="Discussion Forums" container:grid_position="HHTKLZ,CSKMCT"></anvil-component>
          <anvil-component type="Link" name="login_register_link" prop:text="Login / Register" container:grid_position="NHBPVZ,GITVLF"></anvil-component>
          <anvil-component type="Link" name="logout_link" prop:text="Logout" container:grid_position="EUOCFT,KGAWQF"></anvil-component>
          <anvil-component type="Link" name="profile" prop:text="Profile" container:grid_position="FFFVCD,NCABEC"></anvil-component>
          <anvil-component type="Link" name="memberships" prop:text="   Member" container:grid_position="PSXAYB,HTNWYK"></anvil-component>
          <anvil-component type="Link" name="have_done" prop:text="   HaveDone" container:grid_position="ODBGPZ,XKYNDQ"></anvil-component>
        </anvil-component>
      </div>
      <div>
        <anvil-slot name="content"></anvil-slot>
      </div>
    </div>
  </anvil-block>
  <anvil-block slot="title">
    <anvil-slot name="title"></anvil-slot>
  </anvil-block>
</anvil-form>
