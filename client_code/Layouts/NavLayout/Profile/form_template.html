Badges

Badges, as described below, provide evidence that the user is a Naturist in good standing. Are they a member of naturist organizations? Are they willing to abide by a Naturist ethics pledge? As a stretch are they willing to undergo a criminal background check? Though not perfect, these badges give some indication that they are good citizens in the naturist community.

Naturist association membership badges - Naturist associations will be provided with an API (application program interface) whereby a member of the association can submit a form that includes at a minimum the member's first and last name,membership number, expiration date and Map Project user name. When a vaild record is submitted, a badge representing the association will be added to the users profile. After the member expiration date, the Map Project user will be instructed to return to the association and resubmit their validation with an updated expiration date. 

Naturist ethics pledge - I would like to work with leadership in the naturist community to develop a Naturist Ethics Pledge. Users who choose to agree to this pledge will have a pledge badge attached to their profile  

Criminal background check - how are criminal background checks handled in the organized naturist community? Pass the background check, get a badge for that.
