      <anvil-component type="TextArea" name="text_area_1" prop:text="Who enjoys being naked? Nobody really knows, partly because there is so much social stigma attached to nudity in general and social nudity (being nude in the presence of others) in particular. So we don't routinely get to discuss one's attitude about nudity in normal social engagements.

The Naturist Map Project seeks to change that. We believe that the naked human body is simply natural, it is who we truly are without adornment. There is nothing wrong with presenting ourselves in our natural state.

We also believe that nudity and sexuality are not inextricably linked. They are two separate states of mind that are otherwise unrelated. One can  just be naked without any sexual intent. That is our normal and natural state.

Here at the Naturist Map Project, we intend to change that. In short, we are giving everyone, worldwide, the opportunity to raise their hand and express their support for nudity, in whatever form they may be comfortable with, while also allowing them to protect their privacy if they believe that is necessary.

The Naturist Map

The Naturist Map is designed so that any user can register their location anywhere in the world and can see where other nudity supporters (identified by their user names) are located around the world. In addition, with the ability to see what users are located in specific cities or postal codes, or with a certain distance from a location, users can also learn which nudity supporters may be near to their home location. 

Privacy

People interested in nudity are rightly concerned about their privacy and we take that concern seriously. Users can control what information in their profile is made available to other individuals or to the public. One example of our privacy protections: it is necessary to provide an address for a user's location. We do not reveal that address however, and instead group users according to their local postal codes. That gets close to the user's actual location without revealing where they actually live. Users can learn more about the privacy controls for their profile data in the User Profile section.
