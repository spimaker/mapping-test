"></anvil-component>
      <anvil-component type="TextArea" name="text_area_1" prop:text="Who enjoys being naked? Nobody really knows, partly because there is so much social stigma attached to nudity in general and social nudity (being nude in the presence of others) in particular. So we don't routinely get to discuss one's attitude about nudity in normal social engagements.

The Naturist Map Project seeks to change that. We believe that the naked human body is simply natural, it is who we truly are without adornment. There is nothing wrong with presenting ourselves in our natural state. [Note: There are subtle differences between the concepts of Naturism, Nudism and non-sexual nudity, but for simplicity in discussion purposes here, we use the term Naturism to refer to all aspects of non-sexual nudity unless the need for more specificity is warranted.]

We also believe that nudity and sexuality are not inextricably linked. They are two separate states of mind that are otherwise unrelated. One can just be naked without any sexual intent. That is our normal and natural state and that is what we are here to celebrate.

Here at the Naturist Map Project, we intend to change that. In short, we are giving everyone, worldwide, the opportunity to raise their hand and express their support for nudity, in whatever form they may be comfortable with, while also allowing them to protect their privacy if they believe that is necessary.

As the population of mapped users grows over time, it opens up the opportunity for a number of community related facilities. The ability to organize community meetings and get togethers. The ability to meet like minded individuals in each user's local community. The ability to educate newcomers and non-naturists about the benefits and frankly, the wonderful feelings that come about from being in a state of clothing freedom. Ultimately, if people support The Naturist Map in sufficient numbers in communities around the world, it offers the opportunity to organize for increased nudity freedom under the law.

Strength comes in numbers and for the first time, The Naturist Map gives this global community the opportunity to demonstrate just how strong our movement actually is. For all these reasons, we encourage everyone who supports the idea of the freedom to be nude to join our ranks, raise your hands and take your places on The Naturist Map.

The Naturist Map

The Naturist Map is designed so that any user can register their location anywhere in the world and can see where other nudity supporters (identified by their user names) are located around the world. In addition, with the ability to see what users are located in specific cities or postal codes, or with a certain distance from a location, users can also learn which nudity supporters may be near to their home location. 

Privacy

People interested in nudity are rightly concerned about their privacy and we take that concern seriously. Users can control what information in their profile is made available to other individuals or to the public. One example of our privacy protections: it is necessary to provide an address for a user's location. We do not reveal that address however, and instead group users according to their local postal codes. That gets close to the user's actual location without revealing where they actually live. Users can learn more about the privacy controls for their profile data in the User Profile section.

Photography

We have one organizing rule that is decidedly different from most nudity related online destinations: no nude photography. One of the biggest problems faced by sites focused on nudism and naturism is that of site visitors who are less interested in the principles of ethical naturism and more interested in getting their sexual jollies at looking at naked people. If we offer no nude photography, then their interest here is significantly diminished. Nevertheless, our connections with our Best Friends collaborators will offer plenty of opportunities to embrace the beauty of the unclothed human body in all of its forms and variations. 

Other Features

There are a number of other features that are under development for deployment in the coming months so we would like to share a taste of what lies on the development roadmap.

--The Scorecard

We cannot know how we are doing without a scorecard and The Scorecard gives us that information. The Scorecard provides the ability to drill down from one of seven global regions into countries, then states &amp; provinces, then cities and finally into postal codes. The Scorecard will reveal the growth of users on the map today, this week, this month, this quarter, this year and the total number of users mapped.

--Best Friends

Oure Best Friends is a curated directory of blogs, podcasts, websites, social media accounts, commercial operations, associations and books that are the finest in content and services related to nudity and Naturism. Any registered user may submit recommendations for inclusion in the Best Friends Directory and those submissions will be reviewed by the curatorial team to determine their appropriateness for inclusion.

--Quotes

Quotes from notable individuals about nudity. Currently staged as its own menu item. May be configured as a random item display at the bottom of every page.
