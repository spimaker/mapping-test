<anvil-form layout="Mapping_Test.Layouts.BaseLayout">
  <anvil-block slot="actions"></anvil-block>
  <anvil-block slot="content">
    <anvil-component type="ColumnPanel" name="column_panel_1" prop:role="card" designer:placeholder="Add components here">
      <anvil-component type="GridPanel" name="grid_panel_1">
        <anvil-component type="Label" name="User_Name_Label" prop:text=" * User Name" prop:align="right" container:row="HIEZTO" container:width_xs="4" container:col_xs="0"></anvil-component>
        <anvil-component type="TextBox" name="User_Name_Value" container:row="HIEZTO" container:width_xs="5" container:col_xs="4"></anvil-component>
        <anvil-component type="Label" name="Country_Code_Label" prop:text="* Country Code" prop:align="right" container:row="LYAQAI" container:width_xs="4" container:col_xs="0"></anvil-component>
        <anvil-component type="DropDown" name="Country_Code_Value" prop:align="left" on:change="self.country_dropdown_change" container:row="LYAQAI" container:width_xs="7" container:col_xs="4"></anvil-component>
        <anvil-component type="Label" name="State_Province_Region_Label" prop:text="* State / Province / Region" prop:align="right" container:row="MHVOXZ" container:width_xs="4" container:col_xs="0"></anvil-component>
        <anvil-component type="DropDown" name="State_Province_Region_Value" on:change="self.state_dropdown_change" container:row="MHVOXZ" container:width_xs="7" container:col_xs="4"></anvil-component>
        <anvil-component type="Label" name="City_Label" prop:text="* City" prop:align="right" container:row="OCPXFO" container:width_xs="4" container:col_xs="0"></anvil-component>
        <anvil-component type="DropDown" name="City_Value" on:change="self.city_dropdown_change" container:row="OCPXFO" container:width_xs="7" container:col_xs="4"></anvil-component>
        <anvil-component type="Label" name="Custom_City_Label" prop:align="right" prop:text="Manually Entered City" container:row="AXQCVS" container:width_xs="4" container:col_xs="0"></anvil-component>
        <anvil-component type="TextBox" name="Custom_City_TextBox" container:row="AXQCVS" container:width_xs="7" container:col_xs="4"></anvil-component>
        <anvil-component type="Label" name="Postal_Code_Label" prop:text="* Postal Code" prop:align="right" container:row="SOBVRV" container:width_xs="4" container:col_xs="0"></anvil-component>
        <anvil-component type="TextBox" name="Postal_Code_Value" container:row="SOBVRV" container:width_xs="5" container:col_xs="4"></anvil-component>
        <anvil-component type="Label" name="Address1_Label" prop:text="* Address 1" prop:align="right" container:row="VKOCPF" container:width_xs="4" container:col_xs="0"></anvil-component>
        <anvil-component type="TextBox" name="Address1_Value" container:row="VKOCPF" container:width_xs="5" container:col_xs="4"></anvil-component>
        <anvil-component type="Label" name="Address2_Label" prop:text="Address 2" prop:align="right" container:row="UTGBFO" container:width_xs="4" container:col_xs="0"></anvil-component>
        <anvil-component type="TextBox" name="Address2_Value" container:row="UTGBFO" container:width_xs="5" container:col_xs="4"></anvil-component>
        <anvil-component type="Label" name="Latitude_Label" prop:text="Latitude
" prop:align="right" prop:visible="false" container:row="YUHHSO" container:width_xs="4" container:col_xs="0"></anvil-component>
        <anvil-component type="TextBox" name="Latitude_Value" prop:type="number" prop:hide_text="false" prop:visible="false" container:row="YUHHSO" container:width_xs="5" container:col_xs="4"></anvil-component>
        <anvil-component type="Label" name="Longitde_Label" prop:text="Longitude" prop:align="right" prop:visible="false" container:row="EJMGVS" container:width_xs="4" container:col_xs="0"></anvil-component>
        <anvil-component type="TextBox" name="Longitude_Value" prop:type="number" prop:visible="false" container:row="EJMGVS" container:width_xs="5" container:col_xs="4"></anvil-component>
        <anvil-component type="Label" name="Formatter_Address_Label" prop:text="Formatted Address" prop:align="right" prop:visible="false" container:row="JNQNKV" container:width_xs="4" container:col_xs="0"></anvil-component>
        <anvil-component type="TextBox" name="Formatted_Address_Value" prop:visible="false" container:row="JNQNKV" container:width_xs="5" container:col_xs="4"></anvil-component>
        <anvil-component type="Button" name="Save_Button" prop:text="Save &amp; Map" on:click="self.save_button_click" container:row="PILLBE" container:width_xs="3" container:col_xs="0"></anvil-component>
        <anvil-component type="Button" name="Search_Button" prop:text="Search" container:row="PILLBE" container:width_xs="4" container:col_xs="3"></anvil-component>
        <anvil-component type="Button" name="Clear_Button" prop:text="Clear Fields" container:row="PILLBE" container:width_xs="4" container:col_xs="8"></anvil-component>
      </anvil-component>
      <anvil-component type="GridPanel" name="grid_panel_2" container:grid_position="VXRTWK,FTNTVD">
        <anvil-component type="Label" name="Cluster_Type_Label" prop:text="Cluster Type
" prop:align="right" container:row="LWTTVO" container:width_xs="3" container:col_xs="0"></anvil-component>
        <anvil-component type="DropDown" name="Cluster_Type_Dropdown" prop:items='["Miles","Kilometers","Postal Code","City","State","Country"]' container:row="LWTTVO" container:width_xs="4" container:col_xs="3"></anvil-component>
        <anvil-component type="Label" name="Threshold_Label" prop:text="Radius Size" prop:align="right" container:row="LWTTVO" container:width_xs="3" container:col_xs="7"></anvil-component>
        <anvil-component type="DropDown" name="Threshold_Dropdown" prop:items='["1","5","10","25","50","100"]' container:row="LWTTVO" container:width_xs="2" container:col_xs="9"></anvil-component>
      </anvil-component>
      <anvil-component type="GridPanel" name="grid_panel_3" container:grid_position="FKZHYJ,ICNDKH">
        <anvil-component type="Button" name="Load_Clusters_Button" prop:text="Load Clusters" prop:visible="false" container:row="ILGUOZ" container:width_xs="5" container:col_xs="0"></anvil-component>
        <anvil-component type="Button" name="fullscreen_button" prop:text="Full Screen Map" container:row="ILGUOZ" container:width_xs="5" container:col_xs="7"></anvil-component>
      </anvil-component>
      <anvil-component type="GoogleMap" name="map_1" prop:height="530.07470703125" container:grid_position="XFSJRJ,HMHCHW"></anvil-component>
    </anvil-component>
  </anvil-block>
  <anvil-block slot="title">
    <anvil-component type="Label" name="label_1" prop:role="h1" prop:text="Map Data Entry"></anvil-component>
  </anvil-block>
</anvil-form>
